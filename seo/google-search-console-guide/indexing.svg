<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><title>Inspect a URL</title><rect width="1200" height="650" rx="24" fill="#101725"/><g font-family="Arial,sans-serif"><text x="60" y="70" font-size="20" fill="#a4e9dd">MARKETAPRO / SEO INTELLIGENCE</text><text x="60" y="145" font-size="50" font-weight="700" fill="#f3f4f9">Inspect a URL</text><text x="60" y="200" font-size="25" fill="#b6c0d0">Check the selected URL before requesting indexing.</text><rect x="60" y="264" width="255" height="205" rx="15" fill="#172333" stroke="#a4e9dd"/><text x="80" y="301" font-size="18" fill="#a4e9dd">01 / INSPECT</text><text x="80" y="366" font-size="30" font-weight="700" fill="#f3f4f9">URL</text><text x="80" y="414" font-size="18" fill="#b6c0d0">Select final URL</text><rect x="335" y="264" width="255" height="205" rx="15" fill="#172333" stroke="#a4e9dd"/><text x="355" y="301" font-size="18" fill="#a4e9dd">02 / CHECK</text><text x="355" y="366" font-size="30" font-weight="700" fill="#f3f4f9">Index status</text><text x="355" y="414" font-size="18" fill="#b6c0d0">Review canonical</text><rect x="610" y="264" width="255" height="205" rx="15" fill="#172333" stroke="#a4e9dd"/><text x="630" y="301" font-size="18" fill="#a4e9dd">03 / TEST</text><text x="630" y="366" font-size="30" font-weight="700" fill="#f3f4f9">Live test</text><text x="630" y="414" font-size="18" fill="#b6c0d0">Check current version</text><rect x="885" y="264" width="255" height="205" rx="15" fill="#172333" stroke="#a4e9dd"/><text x="905" y="301" font-size="18" fill="#a4e9dd">04 / REQUEST</text><text x="905" y="366" font-size="30" font-weight="700" fill="#f3f4f9">Indexing</text><text x="905" y="414" font-size="18" fill="#b6c0d0">No guarantee</text><text x="60" y="565" font-size="24" fill="#f0d69f">Educational illustration — not a live Google interface</text></g></svg>